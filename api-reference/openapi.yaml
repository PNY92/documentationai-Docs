openapi: '3.0.0'
info:
  title: Shopee Auto Redeemer API
  version: 2.0.0
  description: |
    API for authenticating users, managing Shopee shops and products, synchronizing
    catalog data, configuring redemption URLs, and running product boosting operations.

    Protected endpoints require a JWT access token in the `Authorization` header:
    `Bearer <token>`.
  contact:
    name: Shopee Auto Redeemer Support
    email: support@shopeeautoredeemer.local
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
tags:
  - name: Authentication
    description: Login and access-token management.
  - name: Redemption
    description: Public order redemption and model-directory operations.
  - name: Sellers
    description: Administrative seller management.
  - name: Shops
    description: Administrative Shopee shop management.
  - name: Shopee Tokens
    description: Shopee OAuth and token health operations.
  - name: Product Sync
    description: Product catalog synchronization operations.
  - name: Products
    description: Product and model redemption URL management.
  - name: Redemption Targets
    description: Identification and batch assignment of missing redemption URLs.
  - name: Boosting
    description: Product boosting selection and execution.
paths:
  /api/login:
    post:
      tags:
        - Authentication
      summary: Authenticate a user
      description: Authenticates a user and returns access and refresh JWT tokens.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh an access token
      description: Exchanges a valid refresh bearer token for a new access token.
      operationId: refreshAccessToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Access token refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/redemption:
    post:
      tags:
        - Redemption
      summary: Look up an order for redemption
      description: Looks up an order and returns the redemption URLs associated with its items and models. This public endpoint is rate limited to 20 requests per minute per IP address.
      operationId: redeemOrder
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedemptionRequest'
      responses:
        '200':
          description: Redemption URLs and warnings returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/redemption/directories/{directory_key}:
    get:
      tags:
        - Redemption
      summary: Resolve a model directory
      description: Resolves a multi-link model directory into an ordered list of redemption URLs.
      operationId: resolveRedemptionDirectory
      security: []
      parameters:
        - $ref: '#/components/parameters/DirectoryKey'
      responses:
        '200':
          description: Directory URLs returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/sellers:
    get:
      tags:
        - Sellers
      summary: List sellers
      description: Returns all sellers. Requires an administrator JWT.
      operationId: listSellers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sellers returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seller'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Sellers
      summary: Create a seller
      description: Creates a seller account. Requires an administrator JWT.
      operationId: createSeller
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerCreateRequest'
      responses:
        '201':
          description: Seller created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seller'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/sellers/{id}:
    put:
      tags:
        - Sellers
      summary: Update a seller
      description: Updates a seller account. Requires an administrator JWT.
      operationId: updateSeller
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SellerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerUpdateRequest'
      responses:
        '200':
          description: Seller updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seller'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Sellers
      summary: Delete a seller
      description: Deletes a seller account. Requires an administrator JWT.
      operationId: deleteSeller
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SellerId'
      responses:
        '204':
          description: Seller deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/shops:
    get:
      tags:
        - Shops
      summary: List shops
      description: Returns all configured Shopee shops. Requires an administrator JWT.
      operationId: listShops
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Shops returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shop'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Shops
      summary: Create a shop
      description: Creates a Shopee shop configuration. Requires an administrator JWT.
      operationId: createShop
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopCreateRequest'
      responses:
        '201':
          description: Shop created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/shops/{id}:
    get:
      tags:
        - Shops
      summary: Get a shop
      description: Returns one Shopee shop. Requires an administrator JWT.
      operationId: getShop
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShopId'
      responses:
        '200':
          description: Shop returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Shops
      summary: Update a shop
      description: Updates a Shopee shop configuration. Requires an administrator JWT.
      operationId: updateShop
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShopId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopUpdateRequest'
      responses:
        '200':
          description: Shop updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Shops
      summary: Delete a shop
      description: Deletes a Shopee shop configuration. Requires an administrator JWT.
      operationId: deleteShop
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShopId'
      responses:
        '204':
          description: Shop deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/shops/{id}/token/create:
    post:
      tags:
        - Shopee Tokens
      summary: Create Shopee authorization
      description: Starts Shopee authorization for a shop and returns its OAuth authorization URL.
      operationId: createShopToken
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShopId'
      responses:
        '200':
          description: Authorization URL returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/shops/{id}/token/refresh:
    get:
      tags:
        - Shopee Tokens
      summary: Refresh a Shopee token
      description: Refreshes the Shopee token associated with a shop.
      operationId: refreshShopToken
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShopId'
      responses:
        '200':
          description: Shopee token refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/token/health:
    get:
      tags:
        - Shopee Tokens
      summary: Check token health
      description: Returns the token health for a shop accessible to the authenticated user.
      operationId: getTokenHealth
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShopIdQuery'
      responses:
        '200':
          description: Token health returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/token/auth-url:
    get:
      tags:
        - Shopee Tokens
      summary: Get a Shopee authorization URL
      description: Returns the Shopee OAuth authorization URL for a shop accessible to the authenticated user.
      operationId: getTokenAuthUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShopIdQuery'
      responses:
        '200':
          description: Authorization URL returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/shopee/token/callback:
    get:
      tags:
        - Shopee Tokens
      summary: Handle Shopee OAuth callback
      description: Processes the Shopee OAuth callback and redirects the user after token authorization.
      operationId: handleShopeeTokenCallback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code returned by Shopee.
          schema:
            type: string
        - name: shop_id
          in: query
          required: true
          description: Identifier of the shop being authorized.
          schema:
            type: integer
            format: int64
      responses:
        '302':
          description: Redirect after OAuth processing.
          headers:
            Location:
              description: Redirect destination.
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/sync-products:
    get:
      tags:
        - Product Sync
      summary: Trigger product synchronization
      description: Starts a full or incremental product synchronization for a shop.
      operationId: triggerProductSync
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShopIdQuery'
        - name: mode
          in: query
          required: true
          description: Synchronization mode.
          schema:
            type: string
            enum:
              - full
              - incremental
      responses:
        '200':
          description: Synchronization job started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/sync-products/status:
    get:
      tags:
        - Product Sync
      summary: Get product synchronization status
      description: Returns the current product synchronization status for a shop.
      operationId: getProductSyncStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShopIdQuery'
      responses:
        '200':
          description: Synchronization status returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/products:
    get:
      tags:
        - Products
      summary: List products
      description: Returns products for a shop accessible to the authenticated user.
      operationId: listProducts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShopIdQuery'
      responses:
        '200':
          description: Products returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Products
      summary: Create a product
      description: Creates a product for a shop.
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/products/{product_id}:
    get:
      tags:
        - Products
      summary: Get a product
      description: Returns one product by its identifier.
      operationId: getProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/products/{product_id}/redeem_url:
    post:
      tags:
        - Products
      summary: Set a product redemption URL
      description: Sets the product-level redemption URL.
      operationId: setProductRedemptionUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedemptionUrlRequest'
      responses:
        '200':
          description: Product redemption URL updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/products/{product_id}/models/{model_id}/redeem_url:
    post:
      tags:
        - Products
      summary: Set a model redemption URL
      description: Sets the redemption URL for a specific product model.
      operationId: setModelRedemptionUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/ModelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedemptionUrlRequest'
      responses:
        '200':
          description: Model redemption URL updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/products/{product_id}/models/{model_id}/redemption_urls:
    put:
      tags:
        - Products
      summary: Replace model redemption URLs
      description: Replaces the complete ordered URL list for a product model.
      operationId: replaceModelRedemptionUrls
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/ModelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRedemptionUrlsRequest'
      responses:
        '200':
          description: Model redemption URLs replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/products/redemption-targets:
    get:
      tags:
        - Redemption Targets
      summary: List missing redemption targets
      description: Returns products and models that do not have redemption URLs.
      operationId: listRedemptionTargets
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShopIdQuery'
      responses:
        '200':
          description: Redemption targets returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RedemptionTarget'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/products/redemption-targets/batch:
    post:
      tags:
        - Redemption Targets
      summary: Apply batch redemption assignments
      description: Applies safe batch assignments and reports assignments that were skipped.
      operationId: applyRedemptionTargetBatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAssignmentRequest'
      responses:
        '200':
          description: Batch assignments processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/products/boost-selection:
    put:
      tags:
        - Boosting
      summary: Update product boost selection
      description: Enables or disables boosting for a set of products.
      operationId: updateBoostSelection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoostSelectionRequest'
      responses:
        '200':
          description: Boost selection updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/products/boost/run:
    post:
      tags:
        - Boosting
      summary: Run product boosting
      description: Runs round-robin boosting for the selected products.
      operationId: runProductBoosting
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Boosting run completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoostRunResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token, or refresh token for the token refresh endpoint.
  parameters:
    DirectoryKey:
      name: directory_key
      in: path
      required: true
      description: Key of the multi-link model directory.
      schema:
        type: string
    SellerId:
      name: id
      in: path
      required: true
      description: Seller identifier.
      schema:
        type: integer
        format: int64
    ShopId:
      name: id
      in: path
      required: true
      description: Shop identifier.
      schema:
        type: integer
        format: int64
    ShopIdQuery:
      name: shop_id
      in: query
      required: true
      description: Shop identifier.
      schema:
        type: integer
        format: int64
    ProductId:
      name: product_id
      in: path
      required: true
      description: Product identifier.
      schema:
        type: integer
        format: int64
    ModelId:
      name: model_id
      in: path
      required: true
      description: Shopee model identifier.
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The authenticated user is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: The request rate limit was exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: Standard error response.
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Application-specific error code.
        message:
          type: string
          description: Human-readable error message.
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
